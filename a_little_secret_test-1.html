<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Little Secret | 19.11</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Trebuchet MS",Arial,sans-serif;color:#704b60;background:radial-gradient(circle at 15% 20%,#fff 0 2px,transparent 3px),radial-gradient(circle at 85% 35%,#fff 0 2px,transparent 3px),linear-gradient(145deg,#fff6f8,#f9e1ec,#f8eee6);display:flex;justify-content:center;align-items:center;padding:22px}
.card{width:100%;max-width:430px;padding:30px 22px;text-align:center;background:rgba(255,255,255,.86);border:1px solid white;border-radius:28px;box-shadow:0 15px 45px #b77e9b30;animation:appear .8s ease}
@keyframes appear{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.sparkle{font-size:26px;animation:twinkle 2s infinite alternate}
@keyframes twinkle{from{opacity:.45;transform:scale(.9)}to{opacity:1;transform:scale(1.1)}}
h1{font-family:Georgia,serif;font-weight:normal;font-size:30px;margin:14px 0 8px;color:#b85f88}
.subtitle{font-size:14px;line-height:1.7;color:#99768a}
input{width:100%;padding:15px;margin:18px 0 12px;border:1px solid #edcada;border-radius:14px;background:#fffafd;font-size:16px;text-align:center;color:#704b60;outline:none}
input:focus{border-color:#d48bad;box-shadow:0 0 0 3px #f5dce8}
button{width:100%;padding:14px;border:0;border-radius:14px;color:white;background:linear-gradient(100deg,#d98eaf,#bd7298);font-size:15px;font-weight:bold;cursor:pointer}
#feedback{min-height:22px;margin-top:12px;font-size:13px;color:#bc5478}
#letter{display:none;margin-top:20px;padding:22px 17px;border-radius:18px;background:#fff7fa;border:1px dashed #e5a9c5;line-height:1.8;animation:appear .8s ease}
#letter h2{color:#b85f88;font-family:Georgia,serif;font-weight:normal}
.message{white-space:pre-line;text-align:left;font-size:15px}
.footer{margin-top:24px;font-size:12px;color:#b18da0}
.demo{font-size:12px;color:#a57b91;background:#fff3f8;border-radius:10px;padding:9px;margin-top:14px;line-height:1.6}
</style>
</head>
<body>
<main class="card">
  <div class="sparkle">✧ ⋆｡˚ ♡ ˚｡⋆ ✧</div>
  <h1>A Little Secret</h1>
  <div class="subtitle">19.11.2026<br>Một món quà nhỏ đang chờ cậu mở ra.<br>Cậu có mật mã của mình chưa? 💌</div>
  <form id="login">
    <input id="password" type="password" inputmode="numeric" autocomplete="off" placeholder="Nhập ngày sinh: DDMMYYYY" maxlength="10" required>
    <button type="submit">Mở phong thư ♡</button>
  </form>
  <div id="feedback" aria-live="polite"></div>
  <section id="letter">
    <div class="sparkle">💌</div>
    <h2 id="greeting"></h2>
    <div class="message" id="message"></div>
    <p style="color:#bd7298">♡ From the girls of our class ♡</p>
    <button id="back" type="button">Đóng thư</button>
  </section>
  <div class="demo"><b>BẢN TEST</b> — dùng 3 mật khẩu mẫu bên dưới để thử. Đây chưa phải website online.</div>
  <div class="footer">a little surprise, made with love ✧</div>
</main>
<script>
const gifts = {
  "14022010": {
    name: "Minh (bạn mẫu)",
    message: "Chúc Minh có một ngày 19/11 thật vui vẻ! 🎉\\n\\nMong cậu luôn tự tin, học tập thật tốt và đạt được những điều mình mong muốn. Cảm ơn vì đã là một mảnh ghép của lớp mình nhé! ♡"
  },
  "25032010": {
    name: "An (bạn mẫu)",
    message: "Happy Men's Day, An! 🌷\\n\\nChúc cậu luôn vui vẻ, gặp nhiều may mắn, kiểm tra gặp đúng bài đã ôn và ngày nào đến lớp cũng có chuyện vui để kể. ✨"
  },
  "09112010": {
    name: "Khang (bạn mẫu)",
    message: "Gửi Khang một lời chúc nhỏ nhân ngày 19/11! 💌\\n\\nChúc cậu luôn giữ được sự nhiệt tình, có thật nhiều kỷ niệm đẹp với lớp và ngày càng tiến bộ trên hành trình của mình. ♡"
  }
};
const form=document.getElementById("login"), input=document.getElementById("password"), feedback=document.getElementById("feedback"), letter=document.getElementById("letter");
form.addEventListener("submit",function(event){
  event.preventDefault();
  const key=input.value.replace(/\D/g,"");
  const person=gifts[key];
  if(!person){feedback.textContent="Mật mã chưa đúng rồi, thử lại nhé! ♡";letter.style.display="none";return;}
  document.getElementById("greeting").textContent="Gửi "+person.name+" ♡";
  document.getElementById("message").textContent=person.message;
  feedback.textContent="Mở được bí mật rồi! ✨";
  letter.style.display="block";form.style.display="none";input.value="";
  letter.scrollIntoView({behavior:"smooth",block:"nearest"});
});
document.getElementById("back").addEventListener("click",function(){letter.style.display="none";form.style.display="block";feedback.textContent="Một bí mật đã được mở ♡";});
</script>
</body>
</html>
